plugins {
    id "com.android.application"
}

// Only the public HTTPS endpoint belongs in the APK, never an Apple key or JWT.
def shazamTokenEndpoint = providers.gradleProperty("SHAZAM_TOKEN_ENDPOINT").orElse("").get()
def shazamSdk = file("libs/shazamkit-android-release.aar")
def shazamAvailable = shazamSdk.isFile()

android {
    namespace "com.sandra.radiotv"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    // Compile exactly one implementation; the optional Apple SDK must not block radio builds.
    sourceSets {
        main.java.srcDir(shazamAvailable ? "src/shazam/java" : "src/noShazam/java")
    }

    defaultConfig {
        applicationId "com.sandra.radiotv"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "2.0"
        buildConfigField "String", "SHAZAM_TOKEN_ENDPOINT", groovy.json.JsonOutput.toJson(shazamTokenEndpoint)
        buildConfigField "boolean", "SHAZAM_SDK_AVAILABLE", shazamAvailable.toString()
    }
}

dependencies {
    def media3_version = "1.11.0"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"

    // Download the official ShazamKit 2.1.1 Android AAR from Apple (see SHAZAMKIT_SETUP.md).
    // AGP 9 already provides built-in Kotlin support for the small SDK bridge.
    if (shazamAvailable) {
        implementation files(shazamSdk)
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
        implementation "com.squareup.okhttp3:okhttp:4.12.0"
        implementation "com.squareup.retrofit2:retrofit:2.11.0"
        implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    }
}

// Bundle local audio at build time; neither source audio nor generated assets enter Git.
def playlistConfigFile = file('playlists/pentatonix.json')
def playlistConfig = new groovy.json.JsonSlurper().parse(playlistConfigFile)
def playlistSource = file(playlistConfig.sourceDirectory.toString().replaceFirst('^~/',
        java.util.regex.Matcher.quoteReplacement(System.getProperty('user.home') + '/')))
def generatedPlaylistAssets = layout.buildDirectory.dir('generated/localPlaylistAssets')
def generateLocalPlaylists = tasks.register('generateLocalPlaylists') {
    inputs.file(playlistConfigFile)
    inputs.files(fileTree(playlistSource))
    outputs.dir(generatedPlaylistAssets)
    doLast {
        def songs = fileTree(playlistSource).files.findAll {
            it.isFile() && playlistConfig.extensions.contains(it.name.tokenize('.').last().toLowerCase(java.util.Locale.ROOT))
        }.sort { a, b ->
            def comparison = a.name.compareToIgnoreCase(b.name)
            comparison != 0 ? comparison : a.path.compareTo(b.path)
        }
        if (songs.isEmpty()) {
            throw new GradleException("No MP3/M4A songs found in ${playlistSource}. Add your Pentatonix files before building.")
        }
        def output = generatedPlaylistAssets.get().asFile
        delete(output)
        def folder = new File(output, 'playlists/' + playlistConfig.id)
        folder.mkdirs()
        def tracks = songs.withIndex().collect { song, index ->
            def extension = song.name.tokenize('.').last().toLowerCase(java.util.Locale.ROOT)
            def filename = String.format(java.util.Locale.ROOT, '%04d.%s', index, extension)
            java.nio.file.Files.copy(song.toPath(), new File(folder, filename).toPath())
            [title: song.name.replaceFirst(/\.[^.]+$/, ''), uri: "asset:///playlists/${playlistConfig.id}/${filename}"]
        }
        new File(folder, 'playlist.json').text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson([name: playlistConfig.name, tracks: tracks]))
    }
}
android.sourceSets.main.assets.srcDir(generatedPlaylistAssets.get().asFile)
tasks.named('preBuild').configure { dependsOn(generateLocalPlaylists) }
